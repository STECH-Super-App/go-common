name: i18n-push
on:
  push:
    branches: [main]
    paths:
      - 'pkg/i18n/translations/en.json'
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Push en source to Tolgee
        run: npx --yes @tolgee/cli@2 push --api-url "$TOLGEE_API_URL"
        env:
          TOLGEE_API_URL: ${{ secrets.TOLGEE_API_URL }}
          TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
