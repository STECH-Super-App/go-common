name: i18n-push
on:
  push:
    branches: [main]
    paths:
      - 'pkg/notifyrender/translations/en.json'
      - 'pkg/i18n/translations/en.json'
  workflow_dispatch:
jobs:
  push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Push en source to Tolgee
        uses: tolgee/github-action@v2
        with:
          api-url: ${{ secrets.TOLGEE_API_URL }}
          api-key: ${{ secrets.TOLGEE_API_KEY }}
          command: push
