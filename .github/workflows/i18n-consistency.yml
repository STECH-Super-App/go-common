name: i18n-consistency
on:
  pull_request:
    paths:
      - 'pkg/i18n/translations/**'
      - 'scripts/check-i18n-consistency.sh'
      - '.github/workflows/i18n-consistency.yml'
  workflow_dispatch:

jobs:
  consistency:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run shell consistency check
        run: bash scripts/check-i18n-consistency.sh
