name: Go CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
          cache: false
      # go-common imports the private gen-go-lib module; without the PAT, the
      # linter's typecheck can't resolve it (git ls-remote exit 128).
      - name: Configure Git for Private Modules
        env:
          GEN_GO_PAT: ${{ secrets.GEN_GO_PAT }}
        run: |
          git config --global url."https://${GEN_GO_PAT}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8.0
        env:
          GOPRIVATE: github.com/STECH-Super-App/*

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.25.5'
      - name: Configure Git for Private Modules
        env:
          GEN_GO_PAT: ${{ secrets.GEN_GO_PAT }}
        run: |
          git config --global url."https://${GEN_GO_PAT}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
      - name: Test
        env:
          GOPRIVATE: github.com/STECH-Super-App/*
        run: go test -v -race ./...
