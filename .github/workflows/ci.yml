name: Go CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          # One source of truth: the toolchain go.mod declares (it was pinned to
          # 1.25.5 here while go.mod said 1.25.6).
          go-version-file: go.mod
          cache: false
      # go-common imports the private gen-go-lib module; without the PAT, the
      # linter's typecheck can't resolve it (git ls-remote exit 128).
      - name: Configure Git for Private Modules
        env:
          GEN_GO_PAT: ${{ secrets.GEN_GO_PAT }}
        run: |
          git config --global url."https://${GEN_GO_PAT}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
      # go-common lints itself with the STRICT config — the one a service adopts
      # to switch the mechanical guards on — so the config is exercised on real
      # code every run and go-common cannot break a rule it asks others to keep.
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v7
        with:
          version: v2.8.0
          args: --config .golangci.strict.yml
        env:
          GOPRIVATE: github.com/STECH-Super-App/*

  guards:
    name: Guards fire
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: false
      - name: Configure Git for Private Modules
        env:
          GEN_GO_PAT: ${{ secrets.GEN_GO_PAT }}
        run: |
          git config --global url."https://${GEN_GO_PAT}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
      - name: Install golangci-lint
        env:
          GOPRIVATE: github.com/STECH-Super-App/*
        run: go install github.com/golangci/golangci-lint/v2/cmd/golangci-lint@v2.8.0
      # Lints a deliberately bad sample and fails when a rule stops matching: a
      # guard that silently stops firing looks exactly like a clean service.
      - name: Every guard fires on the violations sample
        env:
          GOPRIVATE: github.com/STECH-Super-App/*
        run: scripts/check-guards.sh "$(go env GOPATH)/bin/golangci-lint"

  test:
    name: Test
    runs-on: ubuntu-latest
    # A real Postgres for the outbox Store, migrations and Deduplicator tests
    # (SL-16). REQUIRE_DB=1 below turns a missing database into a failure, so a
    # workflow edit that drops this container cannot leave them silently skipped.
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - name: Configure Git for Private Modules
        env:
          GEN_GO_PAT: ${{ secrets.GEN_GO_PAT }}
        run: |
          git config --global url."https://${GEN_GO_PAT}:x-oauth-basic@github.com/".insteadOf "https://github.com/"
      - name: Test
        env:
          GOPRIVATE: github.com/STECH-Super-App/*
          GOCOMMON_TEST_POSTGRES_URL: postgres://postgres:postgres@localhost:5432/postgres?sslmode=disable
          REQUIRE_DB: "1"
        run: go test -v -race ./...
