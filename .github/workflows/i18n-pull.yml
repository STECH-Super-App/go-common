name: i18n-pull
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
jobs:
  pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - name: Pull translations from Tolgee
        uses: tolgee/github-action@v2
        with:
          api-url: ${{ secrets.TOLGEE_API_URL }}
          api-key: ${{ secrets.TOLGEE_API_KEY }}
          command: pull
      - name: Open PR if changes
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/i18n-sync-translations-from-tolgee
          commit-message: "chore(i18n): sync translations from Tolgee"
          title: "chore(i18n): sync translations from Tolgee"
          body: "Automated PR from i18n-pull.yml — review and merge."
          delete-branch: true
          add-paths: |
            pkg/i18n/translations/ru.json
