name: i18n-pull
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
jobs:
  pull:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Pull translations from Tolgee
        run: npx --yes @tolgee/cli@2 pull --api-url "$TOLGEE_API_URL"
        env:
          TOLGEE_API_URL: ${{ secrets.TOLGEE_API_URL }}
          TOLGEE_API_KEY: ${{ secrets.TOLGEE_API_KEY }}
      - name: Open PR if changes
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/i18n-sync-translations-from-tolgee
          commit-message: "chore(i18n): sync translations from Tolgee"
          title: "chore(i18n): sync translations from Tolgee"
          body: "Automated PR from i18n-pull.yml — review and merge."
          delete-branch: true
          add-paths: |
            pkg/i18n/translations/ru.json
