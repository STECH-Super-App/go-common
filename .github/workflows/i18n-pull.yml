name: i18n-pull
on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch: {}

jobs:
  pull:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install Tolgee CLI
        run: npm install -g @tolgee/cli
      - name: Pull translations
        env:
          TOLGEE_API_URL: ${{ secrets.TOLGEE_API_URL }}
          TOLGEE_API_KEY_NOTIFICATIONS: ${{ secrets.TOLGEE_API_KEY_NOTIFICATIONS }}
        run: tolgee pull
      - name: Open PR if changes
        uses: peter-evans/create-pull-request@v6
        with:
          branch: chore/i18n-sync-translations-from-tolgee
          commit-message: "chore(i18n): sync translations from Tolgee"
          title: "chore(i18n): sync translations from Tolgee"
          body: "Automated PR from i18n-pull.yml — review and merge."
          add-paths: |
            pkg/notifyrender/translations/ru.toml
            pkg/notifyrender/translations/kk.toml
